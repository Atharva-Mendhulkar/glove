; PlatformIO Project Configuration for AM-CRN Glove (ESP32-S3)
[platformio]
src_dir = firmware

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags = 
    -I firmware/include
    -O2
    -D CORE_DEBUG_LEVEL=5
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0

build_src_filter = 
    +<src/*.c>
    +<examples/esp32s3_glove_main.cpp>
